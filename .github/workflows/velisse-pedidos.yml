name: Velisse - copiar vendas do Stripe

on:
  schedule:
    - cron: "17 * * * *"   # de hora em hora
  workflow_dispatch:

jobs:
  pedidos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - name: Copiar vendas novas
        env:
          VELISSE_GOOGLE_TOKEN: ${{ secrets.VELISSE_GOOGLE_TOKEN }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
        run: python velisse/velisse_bot.py pedidos
