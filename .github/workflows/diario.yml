name: Episodio diario Turminha do Bloquinho
on:
  schedule:
    - cron: "37 20 * * *"   # 17:37 de Brasilia
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Segredos para arquivos
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$TOKEN_JSON" > token.json
          printf '%s' "$GEMINI_KEY" > gemini_key.txt
      - name: Publicar o proximo episodio
        run: python youtube_bot.py publicar 1
      - name: Guardar o que ja foi publicado
        run: |
          git config user.name "robo-bloquinho"
          git config user.email "robo@users.noreply.github.com"
          git add conteudo/publicados.json
          git diff --cached --quiet || (git commit -m "Episodio publicado" && git push)
