name: Compilacao de domingo Turminha do Bloquinho
on:
  schedule:
    - cron: "23 11 * * 0"   # domingo 8:23 de Brasilia
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: robo-bloquinho
  cancel-in-progress: false
jobs:
  compilacao:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Segredos para arquivos
        env:
          BOT_SEGREDOS: ${{ secrets.BOT_SEGREDOS }}
        run: |
          python - <<'PY'
          import json, os
          d = json.loads(os.environ["BOT_SEGREDOS"])
          json.dump(d["client_secret"], open("client_secret.json", "w"))
          json.dump(d["token"], open("token.json", "w"))
          open("gemini_key.txt", "w").write(d["gemini_key"])
          PY
      - name: Publicar a compilacao da semana
        run: python youtube_bot.py compilacao
      - name: Guardar o que ja foi publicado
        if: always()
        run: |
          git config user.name "robo-bloquinho"
          git config user.email "robo@users.noreply.github.com"
          git add conteudo/publicados.json voz
          git diff --cached --quiet || (git commit -m "Compilacao publicada" && git push)
