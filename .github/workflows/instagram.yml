name: Instagram Velisse
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pynacl
      - run: python ig/instagram_bot.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Guardar o que foi postado
        if: always()
        run: |
          git config user.name "robo"; git config user.email "robo@users.noreply.github.com"
          git add ig/publicados.json
          git diff --cached --quiet || (git commit -m "IG: registra publicados" && git push)
